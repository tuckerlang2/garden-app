<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Garden Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap');
  :root{
    --moss-dark:#2C3A22;
    --moss:#4A5D38;
    --soil:#6B4A34;
    --stone:#E3E8DD;
    --stone-deep:#D6DCC9;
    --paper:#F5F4EC;
    --amber:#C98A2E;
    --amber-soft:#E9C77E;
    --clay:#B5573B;
    --ink:#242B1D;
    --ink-soft:#5C6650;
    --silver:#BFC6C4;
    --silver-deep:#9AA3A0;
    --gray-bed:#7C8B93;
    --tan:#DCC79C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--stone); font-family:'Source Sans 3',sans-serif; color:var(--ink);}
  .app{max-width:540px; margin:0 auto; min-height:100vh; background:var(--paper); padding-bottom:40px;}
  header{background:var(--moss-dark); color:var(--stone); padding:22px 20px 16px; border-bottom:4px solid var(--soil); display:flex; align-items:center; gap:12px;}
  header .back{background:none; border:1px solid var(--amber-soft); color:var(--amber-soft); border-radius:8px; padding:6px 10px; font-family:inherit; font-size:13px; font-weight:600;}
  header .titles{flex:1;}
  header h1{font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 2px;}
  header .sub{font-size:12px; color:var(--amber-soft);}

  .map-wrap{margin:16px 20px; background:#fff; border:1px solid var(--stone-deep); border-radius:16px; padding:10px;}
  svg{display:block; width:100%; height:auto; border-radius:10px;}

  .bed-rect{cursor:pointer;}
  .bed-rect rect{transition:filter 0.15s;}
  .bed-rect:active rect{filter:brightness(0.94);}

  .legend-note{margin:0 20px; font-size:12px; color:var(--ink-soft); text-align:center;}

  .bed-list{margin:16px 20px 0; display:flex; flex-direction:column; gap:8px;}
  .bed-list-item{
    display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--stone-deep);
    border-radius:10px; padding:10px 12px;
  }
  .swatch{width:16px; height:16px; border-radius:4px; flex-shrink:0; border:1px solid rgba(0,0,0,0.15);}
  .bed-list-item .info{flex:1;}
  .bed-list-item .name{font-weight:600; font-size:14px;}
  .bed-list-item .dims{font-size:12px; color:var(--ink-soft);}
  .bed-list-item button{background:var(--stone); border:1px solid var(--stone-deep); border-radius:7px; padding:6px 10px; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink);}

  .home-cards{margin:20px; display:flex; flex-direction:column; gap:12px;}
  .home-card{background:var(--tan); border:2px solid #1A1A1A; border-radius:16px; padding:18px; text-align:left; font-family:inherit; display:flex; flex-direction:column; gap:4px; box-shadow:0 2px 0 rgba(0,0,0,0.1);}
  .home-card:active{filter:brightness(0.96); transform:translateY(1px);}
  .home-card-icon{font-size:26px; line-height:1;}
  .home-card-title{font-family:'Fraunces',serif; font-weight:700; font-size:17px; color:var(--ink); margin-top:2px;}
  .home-card-sub{font-size:12.5px; color:var(--ink-soft);}
  .home-screen{position:relative; height:100vh; overflow:hidden;}
  .home-bg-art{position:absolute; inset:0; width:100%; height:100%;}
  .home-content{position:relative; z-index:1;}

  .plant-info-row{display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--stone-deep); border-radius:10px; padding:10px 12px; width:100%; font-family:inherit; text-align:left;}
  .plant-info-row .chev{color:var(--ink-soft); font-size:18px;}

  .warning-list{margin:0 14px 10px; display:flex; flex-direction:column; gap:8px;}
  .warning-item{background:#FBEFE4; border:1px solid var(--amber); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--ink);}

  .actions{display:flex; gap:10px; margin:18px 20px 0;}
  .actions button{flex:1; padding:12px; border-radius:10px; font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; border:none;}
  .btn-export{background:var(--moss-dark); color:var(--paper);}

  /* bed detail view */
  .bed-screen{display:flex; flex-direction:column; height:100dvh; overflow:hidden;}
  .bed-screen header{flex-shrink:0;}
  .canvas-flex{flex:1; min-height:0; margin:10px 20px; background:#fff; border:1px solid var(--stone-deep); border-radius:14px; padding:8px; display:flex; align-items:center; justify-content:center;}
  .canvas-flex svg{width:100%; height:100%; max-width:100%; max-height:100%;}
  .bed-bottom-bar{flex-shrink:0; padding:8px 20px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--stone-deep); background:var(--paper); display:flex; flex-direction:column; gap:8px;}
  .bed-bottom-bar .actions{margin:0;}
  .bed-bottom-bar .plant-select-bar{margin:0;}
  .bed-bottom-bar .palette-hint{margin:0;}

  .palette-label{margin:14px 20px 8px; font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-soft); font-weight:600;}
  .plant-select-bar{display:flex; align-items:center; gap:10px; margin:14px 20px 4px; flex-wrap:wrap;}
  .plant-select-btn{
    background:var(--moss-dark); color:var(--paper); border:none; border-radius:10px; padding:10px 16px;
    font-family:'Fraunces',serif; font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px;
  }
  .plant-select-btn .dot{width:12px; height:12px; border-radius:50%; flex-shrink:0; background:var(--amber-soft);}
  .plant-select-clear{background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; font-family:inherit; padding:0;}
  .spacing-fill-btn{background:var(--amber); color:#fff; border:none; border-radius:10px; padding:9px 14px; font-family:'Fraunces',serif; font-weight:600; font-size:13.5px; margin-left:auto;}
  .plant-popout-item[disabled]{opacity:0.4;}
  .fill-preview-wrap{margin:0 14px 10px; background:#fff; border:1px solid var(--stone-deep); border-radius:10px; padding:8px;}
  .fill-count-line{padding:0 14px 6px; font-size:13px; color:var(--ink-soft);}
  .fill-count-line strong{color:var(--ink);}
  .palette-hint{margin:0 20px 4px; font-size:12px; color:var(--moss); font-weight:600;}

  .plant-popout-backdrop{
    position:fixed; inset:0; background:rgba(36,43,29,0.35); z-index:15;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .plant-popout{
    background:var(--paper); width:100%; max-width:540px; height:26vh; min-height:210px;
    border-radius:18px 18px 0 0; padding:14px 6px 10px; display:flex; flex-direction:column;
    box-shadow:0 -6px 20px rgba(44,58,34,0.25);
  }
  .plant-popout h3{margin:0 14px 8px; font-family:'Fraunces',serif; font-size:16px;}
  .plant-popout-list{overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:2px; padding:0 8px;}
  .plant-popout-item{
    display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:9px; font-size:14.5px;
    font-weight:600; color:var(--ink); border:none; background:none; width:100%; text-align:left; font-family:inherit;
  }
  .plant-popout-item:active{background:var(--stone);}
  .plant-popout-item .dot{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
  .plant-popout-item.custom{color:var(--ink-soft); border-top:1px dashed var(--stone-deep); margin-top:4px; padding-top:14px; border-radius:0;}

  .dims-bar{display:flex; align-items:center; gap:8px; padding:12px 20px; font-size:13px; color:var(--ink-soft); flex-wrap:wrap;}
  .canvas-wrap{margin:0 20px 8px; background:#fff; border:1px solid var(--stone-deep); border-radius:14px; padding:10px;}
  .canvas-hint{font-size:11.5px; color:var(--ink-soft); text-align:center; margin:6px 0 2px;}
  .legend{margin:14px 20px 0; display:flex; flex-wrap:wrap; gap:8px;}
  .legend-item{display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--stone-deep); border-radius:20px; padding:5px 10px; font-size:12.5px;}
  .legend-dot{width:11px; height:11px; border-radius:50%; flex-shrink:0;}

  .growth-list{overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px; padding:0 14px 6px;}
  .growth-item{background:#fff; border:1px solid var(--stone-deep); border-radius:10px; padding:10px 12px;}
  .growth-item-top{display:flex; justify-content:space-between; align-items:center; font-size:13.5px; font-weight:600;}
  .growth-item-top .g-dot{width:11px; height:11px; border-radius:50%; margin-right:7px; display:inline-block; vertical-align:middle;}
  .growth-item .g-days{font-size:12px; color:var(--ink-soft); font-weight:400;}
  .growth-bar-track{background:var(--stone); border-radius:6px; height:7px; margin-top:7px; overflow:hidden;}
  .growth-bar-fill{height:100%; border-radius:6px; background:var(--moss);}
  .growth-bar-fill.ready{background:var(--amber);}
  .growth-empty{padding:20px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  .watering-bar{margin:14px 20px 4px; display:flex; gap:10px;}
  .watering-chip{
    flex:1; background:#fff; border:1px solid var(--stone-deep); border-radius:12px; padding:10px 12px;
    display:flex; align-items:center; gap:9px; text-align:left;
  }
  .watering-drop{width:20px; height:20px; border-radius:50% 50% 50% 4px; transform:rotate(45deg); flex-shrink:0;}
  .watering-chip .zt{font-size:13px; font-weight:600;}
  .watering-chip .zs{font-size:11.5px; color:var(--ink-soft);}
  .watering-sheet{background:var(--paper); width:100%; max-width:400px; border-radius:16px; padding:20px;}
  .watering-sheet h2{font-family:'Fraunces',serif; font-size:18px; margin:0 0 14px;}
  .watering-sheet .field small{display:block; color:var(--ink-soft); font-size:11.5px; margin-top:4px;}
  .season-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px;}
  .season-table td{padding:4px 6px; border-bottom:1px solid var(--stone-deep);}
  .season-table tr.current td{font-weight:700; color:var(--moss-dark);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(36,43,29,0.5); display:flex; align-items:center; justify-content:center; z-index:10; padding:20px;}
  .modal{background:var(--paper); width:100%; max-width:340px; border-radius:16px; padding:20px;}
  .modal h2{font-family:'Fraunces',serif; font-size:18px; margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; padding:9px 10px; border:1px solid var(--stone-deep); border-radius:8px; font-family:inherit; font-size:14.5px; background:#fff; color:var(--ink);}
  .field textarea{resize:vertical;}
  .color-row{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;}
  .color-swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
  .color-swatch.sel{border-color:var(--ink);}
  .modal-actions{display:flex; gap:8px; margin-top:6px;}
  .modal-actions button{flex:1; padding:11px; border-radius:8px; font-family:inherit; font-weight:600; font-size:13.5px; border:none;}
  .btn-cancel{background:var(--stone); color:var(--ink);}
  .btn-save{background:var(--moss-dark); color:var(--paper);}
  .btn-delete{background:var(--clay); color:#fff;}

  /* header utility buttons */
  header .util-btn{background:none; border:1px solid var(--amber-soft); color:var(--amber-soft); border-radius:8px; padding:6px 9px; font-family:inherit; font-size:13px; font-weight:600; margin-left:6px;}

  /* settings page */
  .settings-section{margin:18px 20px;}
  .settings-section h2{font-family:'Fraunces',serif; font-size:16px; margin:0 0 4px;}
  .settings-section .hint{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
  .month-freq-grid{display:flex; flex-direction:column; gap:6px;}
  .month-freq-row{display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--stone-deep); border-radius:8px; padding:8px 12px;}
  .month-freq-row.off{opacity:0.6;}
  .month-freq-row input{width:56px; padding:6px 8px; border:1px solid var(--stone-deep); border-radius:6px; text-align:center; font-family:inherit; font-size:13.5px;}
  .month-freq-row .mfr-label{font-size:13.5px; font-weight:600;}
  .month-freq-row .mfr-unit{font-size:11.5px; color:var(--ink-soft); margin-left:6px;}

  .custom-plant-row{display:flex; align-items:center; gap:9px; background:#fff; border:1px solid var(--stone-deep); border-radius:9px; padding:9px 11px; margin-bottom:6px;}
  .custom-plant-row .dot{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
  .custom-plant-row .name{flex:1; font-size:13.5px; font-weight:600;}
  .custom-plant-row .del-btn{background:none; border:none; color:var(--clay); font-size:19px; font-family:inherit; padding:0 4px; line-height:1;}
  .add-plant-form{background:#fff; border:1px solid var(--stone-deep); border-radius:10px; padding:12px; margin-top:8px;}
  .add-plant-form input[type=text]{width:100%; padding:9px 10px; border:1px solid var(--stone-deep); border-radius:8px; font-family:inherit; font-size:14.5px; margin-bottom:8px;}
  .add-plant-form input[type=number]{width:90px; padding:9px 10px; border:1px solid var(--stone-deep); border-radius:8px; font-family:inherit; font-size:14.5px;}
  .add-plant-form label{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px;}
  .add-plant-form .apf-row{display:flex; align-items:flex-end; gap:12px; margin-top:2px;}

  .bed-edit-card{background:#fff; border:1px solid var(--stone-deep); border-radius:10px; padding:12px; margin-bottom:10px;}
  .bed-edit-card input[type=text]{width:100%; padding:9px 10px; border:1px solid var(--stone-deep); border-radius:8px; font-family:inherit; font-size:14.5px; margin-bottom:9px;}
  .bed-edit-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .bed-edit-grid div{display:flex; flex-direction:column; gap:3px;}
  .bed-edit-grid label{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px;}
  .bed-edit-grid input{width:100%; padding:7px 6px; border:1px solid var(--stone-deep); border-radius:6px; font-family:inherit; font-size:13px; text-align:center;}
  .bed-edit-footer{display:flex; justify-content:flex-end; margin-top:9px;}
  .bed-edit-footer button{background:none; border:none; color:var(--clay); font-size:12.5px; font-weight:600; font-family:inherit; text-decoration:underline;}
  .add-bed-btn{width:100%; padding:12px; border-radius:10px; border:1px dashed var(--stone-deep); background:none; font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--ink-soft);}

  /* shared stat-row/mini-btn, used by the perennial popup */
  .stat-row{display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:13px;}
  .stat-row .stat-text{color:var(--ink);}
  .stat-row .stat-text.due{color:var(--clay); font-weight:600;}
  .stat-row .stat-text.soon{color:var(--amber); font-weight:600;}
  .mini-btn{background:var(--stone); border:1px solid var(--stone-deep); border-radius:6px; padding:4px 9px; font-size:12px; font-family:inherit; color:var(--ink); font-weight:600;}
  .util-btn.active{background:var(--amber-soft); color:var(--moss-dark); border-color:var(--amber-soft);}
  .perennial-marker{cursor:pointer;}
  .garden-tower-marker{cursor:pointer;}
  .tower-leaf{
    transform-box: fill-box;
    transform-origin: center;
    animation: towerLeafSway 3.6s ease-in-out infinite;
  }
  @keyframes towerLeafSway{
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.1) rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .tower-leaf{ animation: none; }
  }

  /* harvest log */
  .hint{font-size:12px; color:var(--ink-soft);}
  .harvest-log-field{border-top:1px dashed var(--stone-deep); padding-top:12px; margin-top:2px;}
  .harvest-log-row{display:flex; gap:8px;}
  .harvest-recent{margin:0 0 14px; font-size:12.5px;}
  .harvest-recent-label{font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  .harvest-entry{display:flex; flex-direction:column; gap:1px; padding:6px 0; border-bottom:1px solid var(--stone-deep);}
  .harvest-entry:last-child{border-bottom:none;}
  .harvest-note{font-size:11.5px; color:var(--ink-soft);}
  .harvest-window-list{max-height:50vh; overflow-y:auto;}
  .empty-state .big-emoji{font-size:36px; display:block; margin-bottom:8px;}

  /* notepad */
  .notepad-list{margin:14px 20px; display:flex; flex-direction:column; gap:8px;}
  .note-card{background:#FFFDF6; border:1px solid var(--stone-deep); border-left:4px solid var(--amber); border-radius:10px; padding:10px 12px; text-align:left; width:100%; font-family:inherit;}
  .note-card .note-date{font-size:11px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;}
  .note-card .note-preview{font-size:14px; margin-top:4px; color:var(--ink); white-space:pre-wrap; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;}
  .note-empty{margin:50px 20px; text-align:center; color:var(--ink-soft);}
  .notepad-editor{margin:14px 20px; background:#FFFDF6; border:1px solid var(--stone-deep); border-radius:12px; overflow:hidden;}
  .notepad-editor-header{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:2px solid #E8B4B8; background:#FFF9EE;}
  .notepad-editor-header .note-editor-date{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink);}
  .notepad-textarea{
    display:block; width:100%; min-height:48vh; border:none; outline:none; resize:vertical;
    background-color:#FFFDF6;
    background-image:
      linear-gradient(to right, transparent 33px, #E8B4B8 33px, #E8B4B8 35px, transparent 35px),
      repeating-linear-gradient(to bottom, transparent, transparent 27px, #C7D3E0 27px, #C7D3E0 28px);
    padding:14px 16px 14px 44px;
    font-family:'Source Sans 3', sans-serif; font-size:15px; line-height:28px; color:var(--ink);
    box-sizing:border-box;
  }
  .notepad-editor-actions{display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--stone-deep);}
  .notepad-editor-actions button{flex:1; padding:11px; border-radius:8px; font-family:inherit; font-weight:600; font-size:13.5px; border:none;}
  .notes-fab{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); max-width:480px; width:calc(100% - 40px); background:var(--moss-dark); color:var(--paper); border:none; border-radius:14px; padding:14px; font-family:'Fraunces',serif; font-size:16px; font-weight:600; box-shadow:0 6px 20px rgba(44,58,34,0.35);}

  /* recipe ideas */
  .veg-chip-grid{margin:0 20px; display:flex; flex-wrap:wrap; gap:7px;}
  .veg-chip{background:#fff; border:1px solid var(--stone-deep); border-radius:20px; padding:7px 13px; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink);}
  .veg-chip.sel{background:var(--moss-dark); border-color:var(--moss-dark); color:var(--paper);}
  .recipe-results-list{margin:16px 20px 0; display:flex; flex-direction:column; gap:10px;}
  .recipe-idea-card{background:#fff; border:1px solid var(--stone-deep); border-radius:12px; padding:12px 14px;}
  .recipe-idea-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .recipe-idea-title{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink); flex:1;}
  .recipe-fav-btn{background:none; border:none; font-size:19px; line-height:1; padding:0 2px; color:var(--ink-soft);}
  .recipe-fav-btn.on{color:var(--amber);}
  .recipe-idea-desc{font-size:13px; color:var(--ink-soft); margin-top:5px; line-height:1.4;}
  .recipe-tag-row{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .recipe-tag{background:var(--stone); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px;}
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
const STORAGE_KEY = 'gardenMapV4';
const NOTES_STORAGE_KEY = 'gardenNotesV1';
const SCHEMA_VERSION = 9;

/*
=====================================================================
 GARDEN TRACKER — architecture notes (read before extending)
=====================================================================
This file is intentionally a standalone, dependency-free widget:
one HTML file, no build step, state persisted via window.storage.
That's deliberate for now — but the data model below is written so
it can grow into a full garden automation system later without a
rewrite. If/when that project starts, here's where things plug in:

  - data.schemaVersion      bump this + extend normalizeData() for
                            any future schema change, so old saves
                            upgrade instead of breaking.
  - data.watering            a single garden-wide schedule (no more
                            per-bed hose zones — you water everything
                            in one pass). Frequency comes from
                            data.seasonalFreq[month], user-editable
                            in Settings; only lastWatered is
                            persisted otherwise. This is where a
                            future valve/pump controller would hook
                            in: writing data.watering.lastWatered
                            from software can be the same signal
                            that triggers the valve. VISUAL: bed fill
                            colors on the map are blended toward red
                            (bedWaterUrgencyPct/blendTowardRed) as the
                            due date approaches, purely as a display
                            layer — b.color itself never changes, only
                            the rendered fill. All beds shift together
                            since watering is garden-wide, not per-bed.
  - data.seasonalFreq[12]    editable per-month watering frequency
                            (days between waterings, or null = off
                            season), seeded from DEFAULT_SEASONAL_FREQ
                            on first load, then fully user-owned.
  - data.customPlants[]      user-added palette entries from Settings
                            (id, name, color, maturityDays) — merged
                            with the built-in PALETTE at render time
                            via effectivePalette().
  - data.harvests[]         harvest log entries, denormalized (plantName
                            /bedName captured at log time so the log
                            stays meaningful after a plant is removed
                            or renamed). Logged from the bed-plant edit
                            modal or the perennial popup ("Log harvest"
                            button on existing plants only, not on
                            first-add). The 🧺 header button on the map
                            shows a rolling "this week, last year"
                            comparison (±7 days around today's date one
                            year back) — deliberately a rolling window,
                            not a fixed calendar-year or year-picker
                            view, so it's always relevant to what's
                            happening in the garden right now.
  - data.gardenTowers[]     fixed circular planters (e.g. a 2.5' tower
                            pot) drawn to true scale on the main map,
                            each on its OWN watering schedule — separate
                            from data.watering (which is only for beds).
                            Deliberately much simpler than beds/perennials:
                            no gradient color animation, no per-plant
                            entries — just a discrete urgency ring
                            (same colors as perennials) plus a purely
                            decorative animated lettuce-leaf graphic so
                            it always reads as planted. The popup is a
                            single free-text field (t.notes) — the person
                            just types what's in it, no structured list.
  - data.perennials[]       permanent plants (trees, shrubs, vines,
                            perennial flowers) placed directly on the
                            MAIN map, not inside a bed — separate from
                            beds because they live forever and aren't
                            part of the seasonal bed-watering pass.
                            Each carries its own waterDays/feedDays +
                            lastWatered/lastFed (same per-plant cadence
                            idea as bed plants' maturity tracking, just
                            applied to watering instead of growth), plus
                            ageYearsAtAdd + dateAdded: age is a plain
                            user-estimated number ("~8 years old"),
                            recalibrated (dateAdded reset to today) any
                            time the person edits it, so it keeps
                            counting up correctly without needing
                            constant manual updates. Lives in core
                            `data` (not its own storage key) since it's
                            low-frequency, spatial, map-level data just
                            like beds. This replaced an earlier
                            standalone "Journal" list view (merged in
                            from garden-planner.html, briefly lived here
                            as its own tab) — that flat list wasn't
                            useful for things that live forever, so it
                            was replaced with map-placed perennial icons
                            instead. If a future need re-emerges for
                            tracking non-perennial potted/indoor plants
                            as a flat list, that's a different feature
                            from this one; don't conflate the two.
  - NOTES live in a SEPARATE storage key (NOTES_STORAGE_KEY), not in
                            the core `data` object above. That's
                            deliberate: notes will grow indefinitely
                            over seasons/years, while core garden
                            data (beds/plants/watering/settings) is
                            small and changes constantly during
                            active use. Keeping them in one blob
                            would mean every plant drag or watering
                            tap rewrites your entire notes history
                            too. Split now, before that becomes slow.
  - data.beds[].plants[]    each plant already carries plantedDate +
                            maturityDays — the seed of a real yearly
                            planting-schedule feature (sow date,
                            transplant date, succession planting,
                            expected harvest window).
  - sensors (not present yet): when temp/pH/soil-moisture hardware
                            is added, model as its own top-level
                            array, e.g. data.sensors = [{ id, type,
                            bedId|zoneId, lastReading, lastReadAt }],
                            plus a data.sensorLog[] for history
                            rather than overloading bed/zone objects.
  - This file talks to window.storage only. A future "large
                            environment" (real backend, Pi service,
                            scheduler) should treat this JSON shape
                            as the contract and sync/import it,
                            rather than this file talking to
                            hardware directly.

No hardware/network features are implemented yet — this is purely
so the data shape won't need to be thrown away later.
=====================================================================

// extra feeding. So standard guideline spacing above is reduced ~25% by
// default. Dense-planted crops (roots/greens/herbs/alliums) already use
// tight guideline numbers as-is and are left untouched. Assumption: the
// "etc." in that principle covers turnip/onion/garlic alongside the
// named lettuce/carrot/herb examples, since they're all small, intensively-
// spaced crops in the SPACING_DATA above already.
const DENSE_PLANTED_IDS = new Set([
  'radish','turnip','carrot','arugula','head_lettuce','leaf_lettuce',
  'basil','coriander','dill','onion','garlic'
]);
const SPACING_REDUCTION = 0.75;

function getSpacingForId(id){
  if(SPACING_DATA.hasOwnProperty(id)){
    const sp = SPACING_DATA[id];
    if(DENSE_PLANTED_IDS.has(id)) return sp;
    return {
      inRow: Math.max(1, Math.round(sp.inRow * SPACING_REDUCTION)),
      betweenRows: Math.max(1, Math.round(sp.betweenRows * SPACING_REDUCTION))
    };
  }
  const custom = (data.customPlants||[]).find(p=>p.id===id);
  if(custom && (custom.spacingInRow || custom.spacingBetweenRows)){
    return { inRow: custom.spacingInRow || null, betweenRows: custom.spacingBetweenRows || null };
  }
  return null;
}

// Original (pre-reduction) guideline spacing, for display/comparison only.
function getGuidelineSpacingForId(id){
  return SPACING_DATA.hasOwnProperty(id) ? SPACING_DATA[id] : null;

function uid(p){ return p + '_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

function todayStr(){ return new Date().toISOString().slice(0,10); }

function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

function daysSince(dateStr){ return daysBetween(dateStr, todayStr()); }

function dateMinusDays(n){
  const d = new Date();
  d.setDate(d.getDate() - (Number(n) || 0));
  return d.toISOString().slice(0,10);
}

function nextDueDate(lastDate, freqDays){
  const d = new Date(lastDate);
  d.setDate(d.getDate() + Number(freqDays));
  return d.toISOString().slice(0,10);
}

function urgencyColor(diff){
  if(diff <= 0) return '#B5573B';
  if(diff <= 1) return '#C98A2E';
  return '#4A5D38';
}

function hexToRgb(hex){
  const h = hex.replace('#','');
  const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
  const n = parseInt(full, 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}

function rgbToHex(r,g,b){
  const clamp = v => Math.round(Math.max(0, Math.min(255, v)));
  return '#' + [r,g,b].map(v=>clamp(v).toString(16).padStart(2,'0')).join('');
}

// Blends a bed's real color toward the overdue-red (--clay) as its watering
// due date approaches — pct 0 = just watered (original color), pct 1 = at
// or past due (fully red). Purely visual "gamification" of the single
// garden-wide watering schedule; doesn't touch the underlying bed color.
function blendTowardRed(hex, pct){
  const p = Math.max(0, Math.min(1, pct));
  if(p <= 0) return hex;
  const c = hexToRgb(hex);
  const target = hexToRgb('#B5573B');
  return rgbToHex(
    c.r + (target.r - c.r) * p,
    c.g + (target.g - c.g) * p,
    c.b + (target.b - c.b) * p
  );
}

// 0 = just watered, 1 = at/past due. Off-season (no active schedule) = 0.
function bedWaterUrgencyPct(){
  const status = wateringStatus();
  if(status.offSeason) return 0;
  return Math.max(0, Math.min(1, 1 - (status.diff / Math.max(status.freq, 1))));
}

  6:2,  // July
  7:1,  // August
  8:2,  // September
  9:3   // October
  // Nov, Dec, Jan, Feb: not in table -> off season
};
const SEASON_MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function defaultSeasonalFreqArray(){
  return SEASON_MONTH_NAMES.map((_,i)=> DEFAULT_SEASONAL_FREQ.hasOwnProperty(i) ? DEFAULT_SEASONAL_FREQ[i] : null);
}

function seasonalFreqDays(d){
  return data.seasonalFreq[d.getMonth()];
}

function wateringStatus(){
  const freq = seasonalFreqDays(new Date());
  if(freq === null || freq === undefined) return { offSeason:true };
  const nextDue = nextDueDate(data.watering.lastWatered, freq);
  const diff = daysBetween(todayStr(), nextDue);
  return { offSeason:false, freq, diff };
}

function effectivePalette(){
  return PALETTE.concat(data.customPlants || []);
}

function paletteItemById(id){
  return effectivePalette().find(p=>p.id===id);
}

function getMaturityDaysForId(id){
  if(MATURITY_DAYS.hasOwnProperty(id)) return MATURITY_DAYS[id];
  const custom = (data.customPlants||[]).find(p=>p.id===id);
  return custom ? (custom.maturityDays || DEFAULT_CUSTOM_MATURITY) : DEFAULT_CUSTOM_MATURITY;
}

function normalizeData(d){
  if(!d.schemaVersion) d.schemaVersion = SCHEMA_VERSION;
  if(!d.watering) d.watering = defaultWatering();
  if(!d.seasonalFreq) d.seasonalFreq = defaultSeasonalFreqArray();
  if(!d.customPlants) d.customPlants = [];
  d.customPlants.forEach(p=>{
    if(!p.hasOwnProperty('spacingInRow')) p.spacingInRow = null;
    if(!p.hasOwnProperty('spacingBetweenRows')) p.spacingBetweenRows = null;
  });
  if(!d.perennials) d.perennials = [];
  if(!d.harvests) d.harvests = [];
  if(!d.gardenTowers) d.gardenTowers = defaultGardenTowers();
  if(!d.bedArchive) d.bedArchive = [];
  if(!d.favoriteRecipes) d.favoriteRecipes = [];
  delete d.zones;
  d.beds.forEach(b=>{
    delete b.zone;
    (b.plants||[]).forEach(p=>{
      if(!p.plantedDate) p.plantedDate = todayStr();
      if(!p.maturityDays) p.maturityDays = DEFAULT_CUSTOM_MATURITY;
      if(!p.hasOwnProperty('paletteId')) p.paletteId = null;
    });
  });
  return d;
}

async function load(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    data = res ? JSON.parse(res.value) : { schemaVersion: SCHEMA_VERSION, beds: defaultBeds(), watering: defaultWatering(), seasonalFreq: defaultSeasonalFreqArray(), customPlants: [], perennials: [], harvests: [], gardenTowers: defaultGardenTowers(), bedArchive: [], favoriteRecipes: [] };
  }catch(e){
    data = { schemaVersion: SCHEMA_VERSION, beds: defaultBeds(), watering: defaultWatering(), seasonalFreq: defaultSeasonalFreqArray(), customPlants: [], perennials: [], harvests: [], gardenTowers: defaultGardenTowers(), bedArchive: [], favoriteRecipes: [] };

/* ---------- MAP VIEW ---------- */

function gardenExtent(){
  let maxX=0, maxY=0;
  data.beds.forEach(b=>{
    maxX = Math.max(maxX, b.x + b.width);
    maxY = Math.max(maxY, b.y + b.depth);
  });
  (data.perennials||[]).forEach(p=>{
    maxX = Math.max(maxX, p.x + 0.5);
    maxY = Math.max(maxY, p.y + 0.5);
  });
  (data.gardenTowers||[]).forEach(t=>{
    maxX = Math.max(maxX, t.x + 1.25);
    maxY = Math.max(maxY, t.y + 1.25);
  });
  return { w: maxX + 1, h: maxY + 1 };
}

function buildMapSvg(){
  const scale = 26;
  const ext = gardenExtent();
  const W = ext.w * scale, H = ext.h * scale;
  const waterPct = bedWaterUrgencyPct();

  const beds = data.beds.map(b=>{
    const bx = b.x*scale, by = b.y*scale, bw = b.width*scale, bh = b.depth*scale;
    const stroke = b.material === 'silver' ? '#8A9391' : (b.material === 'gray' ? '#5F6C70' : (b.material==='wood' ? '#5C4230' : '#C7CDBE'));
    const fill = blendTowardRed(b.color, waterPct);
    const plantDots = (b.plants || []).map(p=>{
      const cx = bx + p.x*bw, cy = by + p.y*bh;
      return `<circle cx="${cx}" cy="${cy}" r="4.2" fill="${p.color}" stroke="#F5F4EC" stroke-width="1"/>`;
    }).join('');
    return `
      <g class="bed-rect" data-bed-id="${b.id}">
        <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
        <text x="${bx+bw/2}" y="${by+14}" font-size="10.5" font-weight="600" fill="#242B1D" text-anchor="middle" font-family="Source Sans 3, sans-serif">${escapeHtml(b.name)}</text>
        <text x="${bx+bw/2}" y="${by+27}" font-size="9.5" fill="#5C6650" text-anchor="middle" font-family="Source Sans 3, sans-serif">${b.width}' × ${b.depth}'</text>
        ${plantDots}
      </g>
    `;
  }).join('');

  const perennials = (data.perennials||[]).map(p=>{
    const cx = p.x*scale, cy = p.y*scale;
    const u = perennialUrgency(p);
    const color = urgencyColor(u.worst);
    return `
      <g class="perennial-marker" data-id="${p.id}">
        <circle cx="${cx}" cy="${cy}" r="14" fill="${color}" stroke="#F5F4EC" stroke-width="2.5"/>
        <text x="${cx}" y="${cy+5}" font-size="14" text-anchor="middle">${perennialEmoji(p.type)}</text>
      </g>
    `;
  }).join('');

  const towers = (data.gardenTowers||[]).map(t=>buildGardenTowerMarker(t, scale)).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="${W}" height="${H}" fill="#EDE6D6"/>
      ${beds}
      ${perennials}
      ${towers}
    </svg>
  `;
}

function svgFlower(cx, cy, r, petalColor, centerColor){
  let petals = '';
  for(let i=0;i<6;i++){
    const angle = i*60;
    petals += `<ellipse cx="${cx}" cy="${(cy-r).toFixed(1)}" rx="${(r*0.4).toFixed(1)}" ry="${(r*0.75).toFixed(1)}" fill="${petalColor}" transform="rotate(${angle} ${cx} ${cy})"/>`;
  }
  return `<g>${petals}<circle cx="${cx}" cy="${cy}" r="${(r*0.36).toFixed(1)}" fill="${centerColor}"/></g>`;
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function generateProceduralIdea(vegNames, methodId, cuisineId){
  const verb = METHOD_VERB[methodId] || 'Prepare';
  const style = CUISINE_STYLE_HINTS[cuisineId] || '';
  const vegText = vegNames.join(' and ');
  return {
    veg: [], method: methodId, cuisine: cuisineId, procedural: true,
    title: `${recipeCuisineLabel(cuisineId)} ${recipeMethodLabel(methodId).toLowerCase()}: ${vegText}`,
    description: `${verb} ${vegText.toLowerCase()}${style ? ', ' + style : ''}.`
  };
}

function matchCuratedRecipes(vegIds){
  const set = new Set(vegIds);
  return RECIPE_IDEAS
    .map(r => ({ ...r, overlap: r.veg.filter(v=>set.has(v)).length }))
    .filter(r => r.overlap > 0)
    .sort((a,b) => b.overlap - a.overlap);
}

// Picks up to 3 ideas: best curated matches first (shuffled within tie tiers
// for variety), then procedural fallbacks to fill any remainder. excludeTitles
// lets "Regenerate" avoid repeating what's already on screen where possible.
function pickRecipeIdeas(vegIds, excludeTitles){
  excludeTitles = excludeTitles || [];
  const matched = matchCuratedRecipes(vegIds).filter(r => !excludeTitles.includes(r.title));
  const maxOverlap = matched.length ? matched[0].overlap : 0;
  const top = shuffleArr(matched.filter(r => r.overlap === maxOverlap));
  const rest = shuffleArr(matched.filter(r => r.overlap < maxOverlap));
  let picks = top.concat(rest).slice(0,3);

  if(picks.length < 3 && vegIds.length){
    const vegNames = vegIds.map(id => { const p = paletteItemById(id); return p ? p.name : id; });
    const usedCombos = picks.map(p => p.method + '|' + p.cuisine);
    let attempts = 0;
    while(picks.length < 3 && attempts < 40){
      attempts++;
      const method = RECIPE_METHODS[Math.floor(Math.random()*RECIPE_METHODS.length)];
      const cuisine = RECIPE_CUISINES[Math.floor(Math.random()*RECIPE_CUISINES.length)];
      const comboKey = method.id + '|' + cuisine.id;
      if(usedCombos.includes(comboKey)) continue;
      usedCombos.push(comboKey);
      const chosenVeg = shuffleArr(vegNames).slice(0, Math.min(2, vegNames.length));
      const idea = generateProceduralIdea(chosenVeg, method.id, cuisine.id);
      if(excludeTitles.includes(idea.title) || picks.find(p=>p.title===idea.title)) continue;
      picks.push(idea);
    }
  }
  return picks.slice(0,3);
}

function exportMapPng(){
  const svgEl2 = document.querySelector('.map-wrap svg');
  const svgString = new XMLSerializer().serializeToString(svgEl2);
  const img = new Image();
  const blob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload = function(){
    const vb = svgEl2.viewBox.baseVal;
    const exportScale = 2.5;
    const canvas = document.createElement('canvas');
    canvas.width = vb.width * exportScale;
    canvas.height = vb.height * exportScale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#EDE6D6';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = 'garden-map.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = url;
}

/* ---------- AUTO-FILL BY ROW SPACING ---------- */
// Sandboxed grid-fill tool: previews a spacing-based planting grid for
// the active bed (never touching bed.plants until confirmed), then on
// "Place" replaces the bed's current plants with the computed grid.
// Rows are staggered (offset every other row) for denser packing, a
// common approach in dense/square-foot planting guides.

let spacingFillPlantId = null;

// How many points of `spacing` fit along a run of `lengthIn`, assuming
// a half-spacing margin on each end (standard garden spacing-chart convention).
function computeFillCount(lengthIn, spacing){
  if(!spacing || spacing <= 0) spacing = 12;
  if(lengthIn <= spacing) return 1;
  return Math.max(1, Math.floor((lengthIn - spacing) / spacing) + 1);
}

function computeFillPositions(lengthIn, spacing, count){
  if(count <= 1) return [lengthIn/2];
  const margin = Math.min(spacing/2, lengthIn/2);
  const usable = lengthIn - margin*2;
  const step = usable / (count - 1);
  const arr = [];
  for(let i=0;i<count;i++) arr.push(margin + i*step);
  return arr;
}

function computeSpacingFillGrid(bed, plantId){
  const item = paletteItemById(plantId);
  if(!item) return null;
  const sp = getSpacingForId(plantId);
  if(!sp || !sp.inRow || !sp.betweenRows) return null;
  const widthIn = bed.width * 12;
  const depthIn = bed.depth * 12;
  const numRows = computeFillCount(depthIn, sp.betweenRows);
  const numPerRow = computeFillCount(widthIn, sp.inRow);
  const rowYs = computeFillPositions(depthIn, sp.betweenRows, numRows);
  const colXs = computeFillPositions(widthIn, sp.inRow, numPerRow);
  const stepX = colXs.length > 1 ? (colXs[1] - colXs[0]) : 0;
  const minX = colXs[0], maxX = colXs[colXs.length - 1];
  const points = [];
  rowYs.forEach((yIn, ri)=>{
    const offset = (ri % 2 === 1) ? stepX/2 : 0;
    colXs.forEach(xIn=>{
      let x = xIn + offset;
      if(x > maxX) x = maxX;
      points.push({ x: Math.min(1, Math.max(0, x / widthIn)), y: Math.min(1, Math.max(0, yIn / depthIn)) });
    });
  });
  return { item, spacing: sp, count: points.length, points };
}

function saveSpacingFillPlantSpacing(id){
  const inRowInput = document.getElementById('fillSpacingInRow');
  const betweenRowsInput = document.getElementById('fillSpacingBetweenRows');
  const inRow = inRowInput ? Number(inRowInput.value) : 0;
  const betweenRows = betweenRowsInput ? Number(betweenRowsInput.value) : 0;
  if(!inRow || !betweenRows) return;
  const custom = (data.customPlants||[]).find(p=>p.id===id);

}

function confirmSpacingFill(){
  const bed = bedById(activeBedId);

  const today = todayStr();

  bed.plants = grid.points.map(pt=>({
    id: uid('pl'), name: grid.item.name, color: grid.item.color,
    x: pt.x, y: pt.y, paletteId: grid.item.id, plantedDate: today, maturityDays
  }));
  spacingFillOpen = false;
  spacingFillPlantId = null;
  save(); render();
}

function buildSpacingFillPreviewSvg(bed, grid){
  const scale = 40;
  const w = bed.width * scale;
  const h = bed.depth * scale;
  const pxPerIn = scale / 12;
  const inRowPx = grid.spacing.inRow * pxPerIn;
  const betweenRowsPx = grid.spacing.betweenRows * pxPerIn;
  const DENSE_THRESHOLD = 60;

  if(grid.count > DENSE_THRESHOLD){
    // At this spacing, individual dots would overlap into an unreadable
    // blob -- draw solid row lines instead, which is a truer picture of
    // what dense planting actually looks like anyway.
    const rowYs = [...new Set(grid.points.map(pt=>pt.y))].sort((a,b)=>a-b);
    const rowThickness = Math.max(3, Math.min(9, betweenRowsPx * 0.5));
    const rows = rowYs.map(yFrac=>{
      const y = yFrac * h;
      return `<line x1="4" y1="${y.toFixed(1)}" x2="${(w-4).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${grid.item.color}" stroke-width="${rowThickness.toFixed(1)}" stroke-linecap="round"/>`;
    }).join('');
    return `
      <svg viewBox="0 0 ${w} ${h}" style="max-height:210px; width:auto; max-width:100%; display:block; margin:0 auto;">
        <rect x="0" y="0" width="${w}" height="${h}" fill="#F5F4EC" stroke="#D6DCC9" stroke-width="1"/>
        ${rows}
      </svg>
      <div style="text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:4px;">Shown as solid rows — too dense to draw individual plants clearly at this spacing.</div>
    `;
  }

  const radius = Math.max(1.5, Math.min(5, Math.min(inRowPx, betweenRowsPx)/2 - 1));
  const dots = grid.points.map(pt=>{
    const cx = pt.x * w, cy = pt.y * h;
    return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${radius.toFixed(1)}" fill="${grid.item.color}" stroke="#F5F4EC" stroke-width="${radius > 3 ? 1.5 : 0.75}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="max-height:210px; width:auto; max-width:100%; display:block; margin:0 auto;"><rect x="0" y="0" width="${w}" height="${h}" fill="#F5F4EC" stroke="#D6DCC9" stroke-width="1"/>${dots}</svg>`;
}

/* ---------- GROWTH TRACKER ---------- */

let growthOpen = false;

function toggleGrowthPopout(){
  growthOpen = !growthOpen;
  render();
}

function renderGrowthPopout(){
  if(!growthOpen) return '';
  const bed = bedById(activeBedId);
  const items = (bed.plants || []).slice().sort((a,b)=>{
    const ra = (a.maturityDays||DEFAULT_CUSTOM_MATURITY) - daysSince(a.plantedDate);
    const rb = (b.maturityDays||DEFAULT_CUSTOM_MATURITY) - daysSince(b.plantedDate);
    return ra - rb;
  });
  const rows = items.length ? items.map(p=>{
    const age = daysSince(p.plantedDate);
    const mat = p.maturityDays || DEFAULT_CUSTOM_MATURITY;
    const pct = Math.min(100, Math.round((age/mat)*100));
    const ready = age >= mat;
    return `
      <div class="growth-item">
        <div class="growth-item-top">
          <span><span class="g-dot" style="background:${p.color}"></span>${escapeHtml(p.name)}</span>
          <span class="g-days">${ready ? 'Ready' : `day ${age} of ${mat}`}</span>
        </div>
        <div class="growth-bar-track"><div class="growth-bar-fill ${ready?'ready':''}" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('') : `<div class="growth-empty">No plants in this bed yet.</div>`;
  return `
    <div class="plant-popout-backdrop" onclick="if(event.target===this) toggleGrowthPopout()">
      <div class="plant-popout">
        <h3>Days growing</h3>
        <div class="growth-list">${rows}</div>
      </div>
    </div>
  `;
}

function addCustomPlant(){
  const nameInput = document.getElementById('newPlantName');

  const inRowInput = document.getElementById('newPlantSpacingInRow');

  const maturityDays = Number(maturityInput.value) || DEFAULT_CUSTOM_MATURITY;

}

/* ---------- PERENNIALS (permanent plants — trees, shrubs — placed directly on the map) ---------- */

const PERENNIAL_TYPES = [
  { id:'tree',   label:'Tree',             emoji:'🌳' },
  { id:'shrub',  label:'Shrub',            emoji:'🌿' },
  { id:'vine',   label:'Vine',             emoji:'🍇' },
  { id:'flower', label:'Perennial flower', emoji:'🌸' },
  { id:'other',  label:'Other',            emoji:'🪴' }
];

function perennialEmoji(type){
  const t = PERENNIAL_TYPES.find(x=>x.id===type);
  return t ? t.emoji : '🪴';
}

function perennialUrgency(p){
  const today = todayStr();
  const waterDiff = daysBetween(today, nextDueDate(p.lastWatered, p.waterDays));
  const feedDiff = daysBetween(today, nextDueDate(p.lastFed, p.feedDays));
  return { waterDiff, feedDiff, worst: Math.min(waterDiff, feedDiff) };
}

function perennialAgeYears(p){
  return p.ageYearsAtAdd + Math.floor(daysSince(p.dateAdded) / 365);
}

function statText(diff, label){
  if(diff <= 0){
    return `<span class="stat-text due">${label} overdue${diff<0 ? ' by '+(-diff)+'d':''}</span>`;
  }
  if(diff <= 1){
    return `<span class="stat-text soon">${label} today or tomorrow</span>`;
  }
  return `<span class="stat-text">${label} in ${diff}d</span>`;
}

function togglePlacingPerennial(){
  placingPerennial = !placingPerennial;
  render();
}

function openPerennialPopup(id){
  perennialPopup = { id, isNew:false };
  render();
}

function closePerennialPopup(){
  perennialPopup = null;
  render();
}

function waterPerennial(id){

  if(p) p.lastWatered = todayStr();

function feedPerennial(id){
  const p = data.perennials.find(x=>x.id===id);

  save(); render();

function deletePerennial(id){

  data.perennials = data.perennials.filter(x=>x.id!==id);

function logPerennialHarvest(id){
  const amount = document.getElementById('perHarvestAmount').value;
  if(!amount) return;
  const unit = document.getElementById('perHarvestUnit').value;
  const notes = document.getElementById('perHarvestNotes').value.trim();
  const p = data.perennials.find(x=>x.id===id);
  logHarvest({ plantId:id, plantName: p ? p.name : 'Perennial', bedName: null, amount, unit, notes });

function savePerennialDetails(id){
  const p = data.perennials.find(x=>x.id===id);

  p.name = document.getElementById('perName').value.trim() || 'Perennial';

  save(); render();
}

  const u = perennialUrgency(p);

  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closePerennialPopup()">
      <div class="modal">

          <select id="perType">
            ${PERENNIAL_TYPES.map(t=>`<option value="${t.id}" ${t.id===p.type?'selected':''}>${t.emoji} ${t.label}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Approx. age (years)</label>
          <input id="perAge" type="number" min="0" step="1" value="${age}">
        </div>
        <div class="field">
          <label>Water every (days)</label>
          <input id="perWaterDays" type="number" min="1" value="${p.waterDays}">
        </div>
        <div class="field">
          <label>Feed every (days)</label>
          <input id="perFeedDays" type="number" min="1" value="${p.feedDays}">
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="perNotes" rows="2" placeholder="Sunny corner, needs deep watering in summer...">${escapeHtml(p.notes||'')}</textarea>
        </div>
        ${!perennialPopup.isNew ? `
        <div class="stat-row">
          ${statText(u.waterDiff, 'Water')}
          <button class="mini-btn" onclick="waterPerennial('${p.id}')">Water now</button>
        </div>
        <div class="stat-row">
          ${statText(u.feedDiff, 'Feed')}
          <button class="mini-btn" onclick="feedPerennial('${p.id}')">Feed now</button>

        <div class="modal-actions">
          ${!perennialPopup.isNew ? `<button class="btn-delete" onclick="deletePerennial('${p.id}')">Delete</button>` : ''}
          <button class="btn-cancel" onclick="closePerennialPopup()">Close</button>
          <button class="btn-save" onclick="savePerennialDetails('${p.id}')">Save</button>
        </div>
      </div>
    </div>
  `;
}

/* map-level placement, dragging, and click routing (separate from bed-canvas equivalents) */

let mapSvgEl = null;
let draggingPerennialId = null;
let draggingTowerId = null;

function mapPointToFeet(evt){
  const pt = mapSvgEl.createSVGPoint();
  const touch = evt.touches ? evt.touches[0] : evt;
  pt.x = touch.clientX; pt.y = touch.clientY;
  const ctm = mapSvgEl.getScreenCTM().inverse();
  const loc = pt.matrixTransform(ctm);
  const scale = 26;
  return { x: Math.max(0, loc.x/scale), y: Math.max(0, loc.y/scale) };
}

function onMapCanvasClick(evt){
  if(evt.target.closest('.perennial-marker')) return;
  if(evt.target.closest('.garden-tower-marker')) return;
  const bedG = evt.target.closest('.bed-rect');
  if(placingPerennial){
    const pt = mapPointToFeet(evt);
    const id = uid('per');
    data.perennials.push({
      id, name:'', type:'tree', ageYearsAtAdd:0, dateAdded: todayStr(),
      waterDays:7, feedDays:30, lastWatered: todayStr(), lastFed: todayStr(),
      notes:'', x: pt.x, y: pt.y
    });
    placingPerennial = false;
    save();
    perennialPopup = { id, isNew:true };
    render();
    return;
  }
  if(bedG){
    openBed(bedG.getAttribute('data-bed-id'));
  }
}

function onMapPointerMove(evt){
  if(draggingPerennialId){
    evt.preventDefault();
    const pt = mapPointToFeet(evt);
    const p = data.perennials.find(x=>x.id===draggingPerennialId);
    if(p){ p.x = pt.x; p.y = pt.y; renderMapCanvasOnly(); }
    return;
  }
  if(draggingTowerId){
    evt.preventDefault();
    const pt = mapPointToFeet(evt);
    const t = data.gardenTowers.find(x=>x.id===draggingTowerId);
    if(t){ t.x = pt.x; t.y = pt.y; renderMapCanvasOnly(); }
  }
}

function onMapPointerUp(){
  if(draggingPerennialId){ draggingPerennialId = null; save(); }
  if(draggingTowerId){ draggingTowerId = null; save(); }
}

function renderMapCanvasOnly(){
  const wrap = document.querySelector('.map-wrap');
  if(!wrap) return;
  wrap.innerHTML = buildMapSvg();
  attachMapSvgHandlers();
}

function attachMapSvgHandlers(){
  mapSvgEl = document.querySelector('.map-wrap svg');
  if(!mapSvgEl) return;
  mapSvgEl.addEventListener('click', onMapCanvasClick);
  mapSvgEl.addEventListener('pointermove', onMapPointerMove);
  mapSvgEl.addEventListener('pointerup', onMapPointerUp);
  mapSvgEl.addEventListener('pointerleave', onMapPointerUp);
  mapSvgEl.querySelectorAll('.perennial-marker').forEach(g=>{
    const id = g.getAttribute('data-id');
    g.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); draggingPerennialId = id; });
    g.addEventListener('click', (e)=>{ e.stopPropagation(); if(!draggingPerennialId) openPerennialPopup(id); });
  });
  mapSvgEl.querySelectorAll('.garden-tower-marker').forEach(g=>{
    const id = g.getAttribute('data-id');
    g.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); draggingTowerId = id; });
    g.addEventListener('click', (e)=>{ e.stopPropagation(); if(!draggingTowerId) openTowerPopup(id); });
  });
}

/* ---------- HARVEST LOG ----------
   Entries are denormalized (plantName/bedName captured at log time) so
   the log stays meaningful even after a plant is removed or renamed.
   Stored in core `data` alongside beds/perennials — low write volume,
   same spatial-garden-record shape as everything else in `data`. */

const HARVEST_UNITS = ['count','lb','oz','kg','g','bunch','handful'];

let harvestWindowOpen = false;

function logHarvest(entry){
  data.harvests.push({
    id: uid('hv'),
    plantId: entry.plantId,
    plantName: entry.plantName,
    bedName: entry.bedName || null,
    date: todayStr(),
    amount: entry.amount,
    unit: entry.unit,
    notes: entry.notes || ''
  });
  save();
}

function harvestsForPlant(plantId){
  return data.harvests.filter(h=>h.plantId===plantId).slice().sort((a,b)=>b.date.localeCompare(a.date));
}

function renderRecentHarvests(plantId){
  const entries = harvestsForPlant(plantId).slice(0,3);
  if(!entries.length) return '';
  const rows = entries.map(h=>`
    <div class="harvest-entry">
      <span>${h.date} — ${h.amount} ${h.unit}</span>
      ${h.notes ? `<span class="harvest-note">${escapeHtml(h.notes)}</span>` : ''}
    </div>
  `).join('');
  return `<div class="harvest-recent"><div class="harvest-recent-label">Recent harvests</div>${rows}</div>`;
}

function renderHarvestFields(idPrefix){
  return `
    <div class="field harvest-log-field">
      <label>Log a harvest</label>
      <div class="harvest-log-row">
        <input id="${idPrefix}Amount" type="number" min="0" step="0.1" placeholder="Amount" style="flex:1;">
        <select id="${idPrefix}Unit" style="flex:1;">
          ${HARVEST_UNITS.map(u=>`<option value="${u}">${u}</option>`).join('')}
        </select>
      </div>
      <input id="${idPrefix}Notes" placeholder="Notes (optional)" style="margin-top:6px;">
    </div>
  `;
}

function openHarvestWindow(){ harvestWindowOpen = true; render(); }
function closeHarvestWindow(){ harvestWindowOpen = false; render(); }

function lastYearWindowHarvests(){
  const today = new Date(todayStr());
  const ref = new Date(today);
  ref.setFullYear(ref.getFullYear() - 1);
  const start = new Date(ref); start.setDate(start.getDate() - 7);
  const end = new Date(ref); end.setDate(end.getDate() + 7);
  const startStr = start.toISOString().slice(0,10);
  const endStr = end.toISOString().slice(0,10);
  return data.harvests
    .filter(h=> h.date >= startStr && h.date <= endStr)
    .slice()
    .sort((a,b)=>a.date.localeCompare(b.date));
}

function renderHarvestWindow(){
  if(!harvestWindowOpen) return '';
  const entries = lastYearWindowHarvests();
  const body = entries.length
    ? entries.map(h=>`
        <div class="harvest-entry">
          <span><b>${escapeHtml(h.plantName)}</b>${h.bedName ? ` · ${escapeHtml(h.bedName)}` : ''} — ${h.amount} ${h.unit}</span>
          <span class="harvest-note">${h.date}${h.notes ? ' · ' + escapeHtml(h.notes) : ''}</span>
        </div>
      `).join('')
    : `<div class="hint">Nothing logged around this week last year — either nothing was ready then, or it wasn't logged.</div>`;
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeHarvestWindow()">
      <div class="modal">
        <h2>This week, last year</h2>
        <div class="harvest-window-list">${body}</div>
        <div class="modal-actions" style="margin-top:14px;">
          <button class="btn-cancel" onclick="closeHarvestWindow()">Close</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------- GARDEN TOWER (fixed circular planter, own watering schedule) ----------
   Deliberately much simpler than beds/perennials: no per-item growth
   tracking, no gradient color animation — just a discrete urgency ring
   (same traffic-light colors as perennials) around a terracotta circle
   drawn to its real 2.5' diameter, plus a purely decorative animated
   lettuce-leaf graphic so it always reads as "planted." Tapping it opens
   a single free-text field — the person just types whatever's in it,
   no structured per-plant entries. */

function towerUrgency(t){
  const today = todayStr();
  const diff = daysBetween(today, nextDueDate(t.lastWatered, t.waterDays));
  return diff;
}

function buildGardenTowerMarker(t, scale){
  const cx = t.x*scale, cy = t.y*scale;
  const r = 1.25 * scale; // 2.5' diameter
  const ringColor = urgencyColor(towerUrgency(t));
  const leafCount = 6;
  let leaves = '';
  for(let i=0;i<leafCount;i++){
    const angle = (i/leafCount) * Math.PI * 2;
    const lx = cx + Math.cos(angle) * r * 0.7;
    const ly = cy + Math.sin(angle) * r * 0.7;
    leaves += `<circle class="tower-leaf" style="animation-delay:${(i*0.35).toFixed(2)}s" cx="${lx}" cy="${ly}" r="${(r*0.32).toFixed(1)}" fill="#8FBE5A" stroke="#4A5D38" stroke-width="1"/>`;
  }
  return `
    <g class="garden-tower-marker" data-id="${t.id}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${TOWER_TERRACOTTA}" stroke="${ringColor}" stroke-width="4"/>
      ${leaves}
      <circle class="tower-leaf" style="animation-delay:0.15s" cx="${cx}" cy="${cy}" r="${(r*0.36).toFixed(1)}" fill="#A9CB5E" stroke="#4A5D38" stroke-width="1"/>
    </g>
  `;
}

function waterTower(id){
  const t = data.gardenTowers.find(x=>x.id===id);
  if(t) t.lastWatered = todayStr();
  save(); render();
}

function openTowerPopup(id){ gardenTowerPopupId = id; render(); }
function closeTowerPopup(){ gardenTowerPopupId = null; render(); }

function saveTowerDetails(id){
  const t = data.gardenTowers.find(x=>x.id===id);
  if(!t) return;
  t.waterDays = Number(document.getElementById('towerWaterDays').value) || t.waterDays;
  t.notes = document.getElementById('towerNotes').value;
  gardenTowerPopupId = null;
  save(); render();
}

function renderGardenTowerPopup(){
  if(!gardenTowerPopupId) return '';
  const t = data.gardenTowers.find(x=>x.id===gardenTowerPopupId);
  if(!t) return '';
  const diff = towerUrgency(t);
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeTowerPopup()">
      <div class="modal">
        <h2>🥬 Garden Tower</h2>
        <div class="field">
          <label>Water every (days)</label>
          <input id="towerWaterDays" type="number" min="1" value="${t.waterDays}">
        </div>
        <div class="stat-row">
          ${statText(diff, 'Water')}
          <button class="mini-btn" onclick="waterTower('${t.id}')">Water now</button>
        </div>
        <div class="field" style="margin-top:12px;">
          <label>What's planted</label>
          <textarea id="towerNotes" rows="5" placeholder="Lettuce, spinach, strawberries...">${escapeHtml(t.notes||'')}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeTowerPopup()">Close</button>
          <button class="btn-save" onclick="saveTowerDetails('${t.id}')">Save</button>
        </div>

    </div>
  `;
}

/* ---------- BED DETAIL VIEW (tap to place plants) ---------- */

function svgPointFromEvent(evt){
  const pt = svgEl.createSVGPoint();
  const touch = evt.touches ? evt.touches[0] : evt;
  pt.x = touch.clientX; pt.y = touch.clientY;
  const ctm = svgEl.getScreenCTM().inverse();
  const loc = pt.matrixTransform(ctm);
  const bed = bedById(activeBedId);
  const scale = 60;
  return { x: Math.min(1, Math.max(0, loc.x / (bed.width*scale))), y: Math.min(1, Math.max(0, loc.y / (bed.depth*scale))) };
}

function onCanvasClick(evt){
  if(evt.target.closest('.marker')) return;
  const p = svgPointFromEvent(evt);
  const bed = bedById(activeBedId);
  if(selectedPaletteId && selectedPaletteId !== 'custom'){
    attemptPlacePlant(activeBedId, p.x, p.y, selectedPaletteId);
    return;
  }
  editingMarker = { isNew:true, x:p.x, y:p.y, name:'', color: PLANT_COLORS[bed.plants.length % PLANT_COLORS.length], maturityDays: DEFAULT_CUSTOM_MATURITY };

/* ---------- COMPANION & CROP-ROTATION WARNINGS ---------- */
// Live-checked only for palette-selected placements (which carry a known
// paletteId); free-typed custom-name plants aren't cross-referenced since
// there's no id to look up. "Place anyway" always available — these are
// advisory, not blocking.

let pendingPlacement = null;

function checkRotationWarning(bedId, paletteId){
  const info = PLANT_INFO[paletteId];
  if(!info || !info.family) return null;
  const archives = (data.bedArchive||[]).filter(a=>a.bedId===bedId)
    .sort((a,b)=> (b.dateArchived||'').localeCompare(a.dateArchived||''))
    .slice(0,3);
  const match = archives.find(a=> (a.families||[]).includes(info.family));
  if(!match) return null;
  return `${FAMILY_LABELS[info.family] || info.family} crops grew here during "${match.label}" — replanting the same family can build up pests and disease.`;
}

function buildPlacementWarnings(bedId, paletteId){
  const warnings = [];
  const bed = bedById(bedId);
  const info = PLANT_INFO[paletteId];
  const item = paletteItemById(paletteId);
  if(info && item){
    (bed.plants||[]).forEach(p=>{
      if(p.paletteId && info.avoid.includes(p.paletteId)){
        warnings.push(`${item.name} doesn't pair well with ${p.name} nearby — commonly cited as bad neighbors.`);
      }
    });
    const rotationWarning = checkRotationWarning(bedId, paletteId);
    if(rotationWarning) warnings.push(rotationWarning);
  }
  return warnings;
}

function attemptPlacePlant(bedId, x, y, paletteId){
  const warnings = buildPlacementWarnings(bedId, paletteId);
  if(warnings.length){
    pendingPlacement = { bedId, x, y, paletteId, warnings };
    render();
  } else {
    commitPlacePlant(bedId, x, y, paletteId);
  }
}

function commitPlacePlant(bedId, x, y, paletteId){
  const bed = bedById(bedId);
  const item = paletteItemById(paletteId);
  bed.plants.push({
    id: uid('pl'), name:item.name, color:item.color, x, y, paletteId:item.id,
    plantedDate: todayStr(), maturityDays: getMaturityDaysForId(item.id)
  });
  save();
  render();
}

function confirmPendingPlacement(){
  if(!pendingPlacement) return;
  const { bedId, x, y, paletteId } = pendingPlacement;
  pendingPlacement = null;
  commitPlacePlant(bedId, x, y, paletteId);
}

function cancelPendingPlacement(){
  pendingPlacement = null;
  render();
}

function renderPlacementWarningModal(){
  if(!pendingPlacement) return '';
  const item = paletteItemById(pendingPlacement.paletteId);
  const items = pendingPlacement.warnings.map(w=>`<div class="warning-item">⚠ ${escapeHtml(w)}</div>`).join('');
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) cancelPendingPlacement()">
      <div class="modal">
        <h3>Before planting ${item ? escapeHtml(item.name) : ''}</h3>
        <div class="warning-list">${items}</div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="cancelPendingPlacement()">Cancel</button>
          <button class="btn-save" onclick="confirmPendingPlacement()">Place anyway</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------- CROP ROTATION: SEASON ARCHIVE ---------- */
// Manual "close out the season" step: snapshots which plant families grew
// in this bed, then clears it. checkRotationWarning() looks at the most
// recent 2-3 archive entries per bed when placing a new plant.

let archivingBedOpen = false;

function openArchiveBed(){

function closeArchiveBed(){

function confirmArchiveBed(){
  const bed = bedById(activeBedId);
  const labelInput = document.getElementById('archiveSeasonLabel');
  const label = (labelInput && labelInput.value.trim()) || `${new Date().getFullYear()} season`;
  const families = Array.from(new Set(
    (bed.plants||[]).map(p => p.paletteId && PLANT_INFO[p.paletteId] ? PLANT_INFO[p.paletteId].family : null).filter(Boolean)
  ));
  if(!data.bedArchive) data.bedArchive = [];
  data.bedArchive.push({ id: uid('arc'), bedId: bed.id, label, dateArchived: todayStr(), families });

function selectColor(c){

function clearBedPlants(){

  save(); render();
}

// Marker size degrades gracefully as plant count rises, so a bed filled
// with tightly-spaced plants (radish, carrots, etc.) doesn't render as a
// solid mass of overlapping 16px circles and stacked text labels. Simple
// area-per-plant heuristic rather than exact nearest-neighbor spacing —
// matches this app's "readable over precise" approach to geometry.
function bedMarkerRadius(bed){
  const n = bed.plants.length;
  if(n <= 1) return 16;
  const areaPerPlant = (bed.width*60 * bed.depth*60) / n;
  const estR = Math.sqrt(areaPerPlant / Math.PI) * 0.55;
  return Math.max(5, Math.min(16, estR));
}

function buildBedSvg(bed){
  const scale = 60;
  const w = bed.width * scale, h = bed.depth * scale;
  let grid = '';
  for(let i=0;i<=Math.ceil(bed.width);i++){
    grid += `<line x1="${i*scale}" y1="0" x2="${i*scale}" y2="${h}" stroke="#D6DCC9" stroke-width="1"/>`;
  }
  for(let j=0;j<=Math.ceil(bed.depth);j++){
    grid += `<line x1="0" y1="${j*scale}" x2="${w}" y2="${j*scale}" stroke="#D6DCC9" stroke-width="1"/>`;
  }
  const r = bedMarkerRadius(bed);
  const showLabels = r >= 10;
  const markers = bed.plants.map(p=>{
    const cx = p.x * w, cy = p.y * h;
    return `
      <g class="marker" data-id="${p.id}">
        <circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="${p.color}" stroke="#F5F4EC" stroke-width="${r > 8 ? 2.5 : 1.2}"/>
        ${showLabels ? `<text x="${cx}" y="${cy - r - 6}" font-size="11" fill="#242B1D" text-anchor="middle" font-weight="600" font-family="Source Sans 3, sans-serif">${escapeHtml(p.name)}</text>` : ''}
      </g>
    `;
  }).join('');
  return `
    <svg id="bedSvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="${w}" height="${h}" fill="#F5F4EC"/>
      ${grid}
      ${markers}
    </svg>
  `;
}

function renderBedCanvasOnly(){
  const wrap = document.getElementById('svgHolder');
  if(!wrap) return;
  wrap.innerHTML = buildBedSvg(bedById(activeBedId));
  attachSvgHandlers();
}

function attachSvgHandlers(){
  svgEl = document.getElementById('bedSvg');
  if(!svgEl) return;
  svgEl.addEventListener('click', onCanvasClick);
  svgEl.addEventListener('pointermove', onSvgPointerMove);
  svgEl.addEventListener('pointerup', onSvgPointerUp);
  svgEl.addEventListener('pointerleave', onSvgPointerUp);
  svgEl.querySelectorAll('.marker').forEach(g=>{
    const id = g.getAttribute('data-id');
    g.addEventListener('pointerdown', (e)=>onMarkerPointerDown(id, e));
    g.addEventListener('click', (e)=>{ e.stopPropagation(); if(!draggingId) openEditMarker(id); });
  });
}

function exportBedPng(){
  const bed = bedById(activeBedId);
  const svgString = new XMLSerializer().serializeToString(document.getElementById('bedSvg'));
  const img = new Image();
  const blob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload = function(){
    const exportScale = 3;
    const canvas = document.createElement('canvas');
    canvas.width = bed.width * 60 * exportScale;
    canvas.height = bed.depth * 60 * exportScale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#F5F4EC';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = bed.name.replace(/\s+/g,'-').toLowerCase() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = url;
}

function renderMarkerModal(){
  if(!editingMarker) return '';
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${editingMarker.isNew ? 'Add plant' : 'Edit plant'}</h2>
        <div class="field">
          <label>Name</label>
          <input id="markerName" value="${escapeHtml(editingMarker.name)}" placeholder="e.g. Basil" autofocus>
        </div>
        <div class="field">
          <label>Color</label>
          <div class="color-row">
            ${PLANT_COLORS.map(c=>`<div class="color-swatch ${c===editingMarker.color?'sel':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Days to maturity</label>
          <input id="markerMaturity" type="number" min="1" value="${editingMarker.maturityDays || DEFAULT_CUSTOM_MATURITY}">
        </div>
        <div class="field">
          <label>Planted (days ago)</label>
          <input id="markerDaysAgo" type="number" min="0" value="${editingMarker.isNew ? 0 : daysSince(editingMarker.plantedDate)}">
          <div class="hint" style="margin-top:4px;">Leave at 0 for today. Enter a number if you forgot to log it at planting time.</div>
        </div>
        ${!editingMarker.isNew ? `
        ${renderHarvestFields('markerHarvest')}
        <div class="modal-actions" style="margin-bottom:12px;">
          <button class="btn-cancel" style="flex:none; padding:9px 14px;" onclick="logMarkerHarvest('${editingMarker.id}')">Log harvest</button>
        </div>
        ${renderRecentHarvests(editingMarker.id)}
        ` : ''}
        <div class="modal-actions">
          ${editingMarker.isNew ? '' : `<button class="btn-delete" onclick="deleteMarker()">Delete</button>`}
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" onclick="confirmSaveMarker()">Save</button>
        </div>
      </div>
    </div>
  `;
}

function renderBed(){
  const bed = bedById(activeBedId);
  return `
    <div class="bed-screen">
      <header>
        <button class="back" onclick="backToMap()">← Map</button>
        <div class="titles">
          <h1>${escapeHtml(bed.name)}</h1>
          <div class="sub">${bed.width}' × ${bed.depth}' — tap to place, drag to move</div>
        </div>
      </header>
      <div class="canvas-flex" id="svgHolder">${buildBedSvg(bed)}</div>
      <div class="bed-bottom-bar">
        ${renderPlantBar()}
        <div class="actions">
          <button class="btn-cancel" style="background:var(--stone); color:var(--ink); font-family:inherit;" onclick="toggleGrowthPopout()">Growth</button>
          <button class="btn-cancel" style="background:var(--stone); color:var(--ink); font-family:inherit;" onclick="clearBedPlants()">Clear bed</button>
          <button class="btn-export" onclick="exportBedPng()">Export</button>
        </div>
        <div class="actions" style="margin-top:8px;">
          <button class="btn-cancel" style="background:var(--stone); color:var(--ink); font-family:inherit;" ${bed.plants.length ? `onclick="openArchiveBed()"` : 'disabled'}>📦 Archive season</button>
        </div>
      </div>
    </div>
    ${renderMarkerModal()}
    ${renderPlantPopout()}
    ${renderGrowthPopout()}
    ${renderSpacingFillPopup()}
    ${renderPlacementWarningModal()}
    ${renderArchiveBedModal()}
  `;
}

/* ---------- ROOT RENDER ---------- */

function render(){
  const root = document.getElementById('root');
  if(!data){ root.innerHTML = `<div style="padding:60px 20px; text-align:center; color:#5C6650;">Loading your garden...</div>`; return; }
  root.style.paddingBottom = (view === 'bed' || view === 'notes') ? '0' : '';
  root.style.overflow = (view === 'home') ? 'hidden' : '';
  root.style.height = (view === 'home') ? '100vh' : '';
  document.body.style.overflow = (view === 'home') ? 'hidden' : '';
  if(view === 'home') root.innerHTML = renderHome();
  else if(view === 'planning') root.innerHTML = renderPlanning();
  else if(view === 'plantInfo') root.innerHTML = renderPlantInfo();
  else if(view === 'recipes') root.innerHTML = renderRecipeIdeas();
  else if(view === 'map') root.innerHTML = renderMap();
  else if(view === 'bed') root.innerHTML = renderBed();
  else if(view === 'settings') root.innerHTML = renderSettings();
  else if(view === 'notes') root.innerHTML = renderNotes();
  if(view === 'bed') attachSvgHandlers();
  if(view === 'map') attachMapSvgHandlers();
}

load();
</script>
</body>
</html>
